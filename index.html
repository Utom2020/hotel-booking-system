<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSc Project Checklist — Hotel Booking System</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f7;min-height:100vh;padding:24px 16px}
  .container{max-width:820px;margin:0 auto}

  /* HEADER */
  .header{background:linear-gradient(135deg,#1F3864 0%,#2E5FA3 100%);border-radius:14px;padding:28px 32px;margin-bottom:24px;color:white}
  .header h1{font-size:22px;font-weight:700;margin-bottom:6px}
  .header p{font-size:13px;opacity:0.85;margin-bottom:18px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{background:rgba(255,255,255,0.15);border-radius:10px;padding:12px 16px;text-align:center}
  .stat-num{font-size:26px;font-weight:700;display:block}
  .stat-label{font-size:11px;opacity:0.8;margin-top:2px;display:block}
  .progress-wrap{background:rgba(255,255,255,0.2);border-radius:99px;height:8px;margin-top:18px;overflow:hidden}
  .progress-bar{height:8px;border-radius:99px;background:#4ade80;transition:width 0.4s ease}

  /* PHASE */
  .phase{background:white;border-radius:12px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
  .phase-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;transition:opacity 0.15s}
  .phase-header:hover{opacity:0.9}
  .phase-left{display:flex;align-items:center;gap:12px}
  .phase-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .phase-title{font-size:14px;font-weight:700;color:#1a1a1a}
  .phase-week{font-size:12px;color:#888;margin-top:2px}
  .phase-right{display:flex;align-items:center;gap:10px}
  .phase-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:#f0f2f7;color:#555}
  .phase-arrow{font-size:18px;color:#aaa;transition:transform 0.25s}
  .phase.open .phase-arrow{transform:rotate(180deg)}
  .phase-body{display:none;border-top:1px solid #f0f0f0}
  .phase.open .phase-body{display:block}

  /* TASKS */
  .task{display:flex;align-items:flex-start;gap:12px;padding:11px 18px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background 0.12s}
  .task:last-child{border-bottom:none}
  .task:hover{background:#f8f9fc}
  .task.done{background:#f0fdf4}
  .checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #d0d5e0;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.15s;background:white}
  .task.done .checkbox{background:#22c55e;border-color:#22c55e}
  .checkmark{display:none;color:white;font-size:13px;font-weight:700}
  .task.done .checkmark{display:block}
  .task-content{flex:1}
  .task-label{font-size:13.5px;font-weight:600;color:#1a1a1a;line-height:1.4}
  .task.done .task-label{text-decoration:line-through;color:#999}
  .task-sub{font-size:12px;color:#888;margin-top:3px;line-height:1.4}
  .task.done .task-sub{color:#bbb}

  /* RESET */
  .reset-btn{display:block;margin:0 auto 32px;padding:10px 28px;background:white;border:1.5px solid #e0e0e0;border-radius:99px;font-size:13px;font-weight:600;color:#666;cursor:pointer;transition:all 0.15s}
  .reset-btn:hover{background:#fee2e2;border-color:#fca5a5;color:#dc2626}

  /* FOOTER */
  .footer{text-align:center;font-size:12px;color:#aaa;padding-bottom:24px}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>MSc Project Checklist</h1>
    <p>Multi-User Hotel Booking System with Concurrency Control &nbsp;|&nbsp; Stella Udoh &nbsp;|&nbsp; University of Hertfordshire &nbsp;|&nbsp; 2025–2026</p>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="done-num">0</span><span class="stat-label">Completed</span></div>
      <div class="stat"><span class="stat-num" id="left-num">0</span><span class="stat-label">Remaining</span></div>
      <div class="stat"><span class="stat-num" id="pct-num">0%</span><span class="stat-label">Progress</span></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="bar" style="width:0%"></div></div>
  </div>

  <div id="phases-container"></div>

  <button class="reset-btn" onclick="resetAll()">&#8635; Reset all tasks</button>

  <div class="footer">Click any task to mark it complete &nbsp;•&nbsp; Progress saves automatically &nbsp;•&nbsp; Deadline: 2nd September 2026</div>

</div>

<script>
const phases = [
  {
    title:"Phase 1 — Literature Review and Design",
    week:"Week 43 to 46",
    icon:"📚",
    color:"#2E5FA3",
    bg:"#EBF0FA",
    tasks:[
      {label:"Submit DPP",sub:"Completed and submitted on Canvas"},
      {label:"Read Silberschatz Ch.15 — Transactions",sub:"ACID properties, transaction states, serializability"},
      {label:"Read Silberschatz Ch.16 — Concurrency Control",sub:"Locking protocols, optimistic control, isolation levels"},
      {label:"Read Kung and Robinson (1981)",sub:"Optimistic concurrency control — the original paper"},
      {label:"Read Bernstein and Goodman (1981)",sub:"Concurrency control in distributed database systems"},
      {label:"Read Gray and Reuter (1992)",sub:"Transaction processing, locking and isolation"},
      {label:"Write literature notes for all sources",sub:"Save as Literature_Notes.docx in your own words"},
      {label:"Draw ERD diagram in draw.io",sub:"Four tables with relationships — export as PNG"},
      {label:"Sketch all application page designs",sub:"Home, register, login, search, booking, conflict, admin"},
      {label:"Start and maintain project diary",sub:"Write an entry after every working session"},
      {label:"Prepare supervisor meeting questions",sub:"Save as Supervisor_Meeting_Questions.docx"},
    ]
  },
  {
    title:"Phase 2 — Core System Development",
    week:"Week 47 to 50",
    icon:"💻",
    color:"#0F6E56",
    bg:"#E1F5EE",
    tasks:[
      {label:"Install XAMPP and start Apache and MySQL",sub:"Download from apachefriends.org"},
      {label:"Create hotel_booking_db database in phpMyAdmin",sub:"Open localhost/phpmyadmin in your browser"},
      {label:"Create all four tables using SQL",sub:"users, rooms, bookings, room_availability"},
      {label:"Set up GitHub repository",sub:"hotel-booking-system — set to private"},
      {label:"Create project folder in htdocs",sub:"C:\\xampp\\htdocs\\hotel_booking"},
      {label:"Build config/db.php — database connection",sub:"mysqli connection with error handling"},
      {label:"Build register.php — user registration",sub:"Password hashing using password_hash()"},
      {label:"Build login.php — session based login",sub:"password_verify() and session_start()"},
      {label:"Build logout.php — session destroy",sub:""},
      {label:"Build index.php — room search form",sub:"Check-in and check-out date inputs"},
      {label:"Build search.php — available rooms by date",sub:"Query room_availability for no booking overlap"},
      {label:"Build book.php — room detail and booking form",sub:""},
      {label:"Build my_bookings.php — user booking history",sub:""},
      {label:"Build cancel.php — booking cancellation",sub:""},
      {label:"Build admin/dashboard.php",sub:"Manage rooms and view all bookings"},
      {label:"Build admin/add_room.php",sub:"Add new rooms to the system"},
      {label:"Test all pages manually end to end",sub:"Register, login, search, book, view, cancel"},
      {label:"Commit all code to GitHub",sub:"Meaningful commit message for each session"},
    ]
  },
  {
    title:"Phase 3 — Concurrency Implementation",
    week:"Week 51 to 52",
    icon:"🔒",
    color:"#854F0B",
    bg:"#FAEEDA",
    tasks:[
      {label:"Create config/locking.php — strategy switch",sub:"define('LOCKING_STRATEGY', 'pessimistic')"},
      {label:"Implement pessimistic locking in book.php",sub:"SELECT FOR UPDATE inside MySQL transaction"},
      {label:"Implement optimistic locking in book.php",sub:"Version column conditional UPDATE"},
      {label:"Build conflict.php — conflict notification page",sub:"Clear friendly message with link back to search"},
      {label:"Add session timeout for booking sessions",sub:"5 minute expiry releases any held locks"},
      {label:"Test pessimistic locking manually",sub:"Two browser tabs — try to book same room simultaneously"},
      {label:"Test optimistic locking manually",sub:"Same test — confirm only one booking succeeds"},
      {label:"Commit all concurrency code to GitHub",sub:""},
    ]
  },
  {
    title:"Phase 4 — Testing and Evaluation",
    week:"Week 53 to 55",
    icon:"🧪",
    color:"#993C1D",
    bg:"#FAECE7",
    tasks:[
      {label:"Write test_concurrency.php script",sub:"Sends simultaneous booking requests for the same room"},
      {label:"Run test 10 times under pessimistic locking",sub:"Record successes, conflicts, double bookings, response time"},
      {label:"Run test 10 times under optimistic locking",sub:"Record the same metrics for direct comparison"},
      {label:"Build results table comparing both strategies",sub:"Throughput, conflict rate, retries, response time"},
      {label:"Write evaluation analysis",sub:"Which strategy is better and under what conditions"},
      {label:"Link findings back to the literature",sub:"Reference Gray, Bernstein and Kung in your analysis"},
      {label:"Commit test scripts and results to GitHub",sub:""},
    ]
  },
  {
    title:"Phase 5 — IPR Submission",
    week:"Week 48 to 49",
    icon:"📄",
    color:"#534AB7",
    bg:"#EEEDFE",
    tasks:[
      {label:"Write IPR Section 1 — Introduction and Overview",sub:"Research question, tools, deliverables, ethics"},
      {label:"Write IPR Section 2 — Progress to Date",sub:"Literature review, design, database, PHP code so far"},
      {label:"Write IPR Section 3 — Planned Work",sub:"All remaining tasks with academic week numbers"},
      {label:"Create Gantt chart in draw.io",sub:"All tasks across Week 43 to 57 — export as PNG"},
      {label:"Assemble all appendices",sub:"ERD, page sketches, phpMyAdmin screenshot, GitHub, Gantt"},
      {label:"Write bibliography in Harvard format",sub:"All sources alphabetically by author surname"},
      {label:"Check body content is 9 pages or under",sub:"Excluding cover, contents, bibliography and appendices"},
      {label:"Submit IPR on Canvas before deadline",sub:""},
    ]
  },
  {
    title:"Phase 6 — Dissertation Writing",
    week:"Week 51 to 57",
    icon:"✍️",
    color:"#3B6D11",
    bg:"#EAF3DE",
    tasks:[
      {label:"Write Chapter 1 — Introduction",sub:"Background, research question, objectives, report structure"},
      {label:"Write Chapter 2 — Literature Review",sub:"All five sources with in-text citations and analysis"},
      {label:"Write Chapter 3 — System Design",sub:"ERD, page designs, database schema, architecture"},
      {label:"Write Chapter 4 — Implementation",sub:"How you built each part, code snippets, decisions made"},
      {label:"Write Chapter 5 — Testing and Evaluation",sub:"Results table, analysis, comparison of both strategies"},
      {label:"Write Chapter 6 — Discussion and Conclusion",sub:"Achievements, limitations, future work, project management"},
      {label:"Write Abstract — half a page summary",sub:"Written last after all chapters are complete"},
      {label:"Write Acknowledgements",sub:""},
      {label:"Complete final bibliography in Harvard format",sub:""},
      {label:"Assemble appendices with titles and page numbers",sub:""},
      {label:"Check total word count is approximately 10,000 words",sub:""},
      {label:"Ask supervisor to review one chapter before submission",sub:""},
      {label:"Submit final dissertation on Canvas",sub:"Deadline: 2nd September 2026"},
    ]
  },
  {
    title:"Phase 7 — Demonstration and Viva",
    week:"Week 57",
    icon:"🎤",
    color:"#993556",
    bg:"#FBEAF0",
    tasks:[
      {label:"Agree demonstration date and time with supervisor",sub:""},
      {label:"Prepare 10 minute demo script",sub:"Registration, login, search, booking, conflict page"},
      {label:"Practise demonstrating the concurrency conflict live",sub:"Open two browsers and show real-time conflict"},
      {label:"Prepare answers to likely questions",sub:"Why SELECT FOR UPDATE, version column, isolation level"},
      {label:"Test all features work on the demonstration machine",sub:"Confirm XAMPP is running and all pages load"},
      {label:"Bring project diary to the demonstration",sub:""},
    ]
  }
];

const STORE_KEY = 'hbs_checklist_v1';

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }
  catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

let state = loadState();
let totalTasks = 0;

function updateStats(){
  const all = document.querySelectorAll('.task');
  const done = document.querySelectorAll('.task.done');
  totalTasks = all.length;
  const d = done.length;
  const pct = totalTasks ? Math.round(d/totalTasks*100) : 0;
  document.getElementById('done-num').textContent = d;
  document.getElementById('left-num').textContent = totalTasks - d;
  document.getElementById('pct-num').textContent = pct + '%';
  document.getElementById('bar').style.width = pct + '%';

  // update phase badges
  phases.forEach((ph, pi) => {
    const phaseDone = document.querySelectorAll(`[data-phase="${pi}"].done`).length;
    const phaseTotal = ph.tasks.length;
    const badge = document.getElementById(`badge-${pi}`);
    if(badge) badge.textContent = phaseDone + ' / ' + phaseTotal;
  });
}

function resetAll(){
  if(!confirm('Reset all tasks? Your progress will be cleared.')) return;
  state = {};
  saveState(state);
  document.querySelectorAll('.task').forEach(t => t.classList.remove('done'));
  updateStats();
}

const container = document.getElementById('phases-container');

phases.forEach((phase, pi) => {
  const div = document.createElement('div');
  div.className = 'phase';
  div.id = 'phase-' + pi;

  div.innerHTML = `
    <div class="phase-header" onclick="togglePhase(${pi})">
      <div class="phase-left">
        <div class="phase-icon" style="background:${phase.bg}">${phase.icon}</div>
        <div>
          <div class="phase-title" style="color:${phase.color}">${phase.title}</div>
          <div class="phase-week">${phase.week}</div>
        </div>
      </div>
      <div class="phase-right">
        <span class="phase-badge" id="badge-${pi}">0 / ${phase.tasks.length}</span>
        <span class="phase-arrow">&#8964;</span>
      </div>
    </div>
    <div class="phase-body" id="body-${pi}"></div>
  `;

  const body = div.querySelector('.phase-body');

  phase.tasks.forEach((task, ti) => {
    const id = `t_${pi}_${ti}`;
    const isDone = state[id] || false;

    const row = document.createElement('div');
    row.className = 'task' + (isDone ? ' done' : '');
    row.dataset.phase = pi;
    row.dataset.id = id;
    row.innerHTML = `
      <div class="checkbox">
        <span class="checkmark">&#10003;</span>
      </div>
      <div class="task-content">
        <div class="task-label">${task.label}</div>
        ${task.sub ? `<div class="task-sub">${task.sub}</div>` : ''}
      </div>
    `;

    row.addEventListener('click', () => {
      row.classList.toggle('done');
      state[id] = row.classList.contains('done');
      saveState(state);
      updateStats();
    });

    body.appendChild(row);
  });

  container.appendChild(div);
});

function togglePhase(pi){
  const ph = document.getElementById('phase-' + pi);
  ph.classList.toggle('open');
}

// open first phase by default
document.getElementById('phase-0').classList.add('open');

updateStats();
</script>
</body>
</html>
